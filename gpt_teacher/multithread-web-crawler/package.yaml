name: multithread-web-crawler
version: 0.1.0.0
github: "githubuser/multithread-web-crawler"
license: BSD-3-Clause
author: "Author name here"
maintainer: "example@example.com"
copyright: "2025 Author name here"

extra-source-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/githubuser/multithread-web-crawler#readme>

dependencies:
  - base >= 4.7 && < 5
  - http-conduit
  - http-client
  - http-client-tls
  - tls <= 2.1.9
  - crypton-connection
  - crypton-x509-store
  - data-default-class
  - tagsoup
  - async
  - bytestring
  - parallel
  - time

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  multithread-web-crawler-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - multithread-web-crawler

tests:
  multithread-web-crawler-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - multithread-web-crawler
